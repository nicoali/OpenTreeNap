name: Clean unused Actions storage

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/clean-unused-actions-storage.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove regenerable Actions caches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let count = 0;
            let bytes = 0;
            while (true) {
              const response = await github.request('GET /repos/{owner}/{repo}/actions/caches', {
                owner, repo, per_page: 100, page: 1
              });
              const caches = response.data.actions_caches || [];
              if (!caches.length) break;
              for (const cache of caches) {
                await github.request('DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}', {
                  owner, repo, cache_id: cache.id
                });
                count++;
                bytes += cache.size_in_bytes || 0;
                core.info(`Cache deleted: ${cache.id}, ${cache.key}, ${cache.size_in_bytes} bytes`);
              }
              if (caches.length < 100) break;
            }
            core.info(`Caches deleted: ${count}; bytes freed: ${bytes}`);
      - name: Remove redundant build artifacts, keep newest 2
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner, repo, per_page: 100
            });
            const matches = artifacts.filter(a => a.name === 'OpenTreeNap-v0.1-debug' && !a.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            core.info(`Found ${matches.length} active 'OpenTreeNap-v0.1-debug' artifacts`);
            let bytes = 0;
            for (const a of matches.slice(2)) {
              await github.rest.actions.deleteArtifact({owner,repo,artifact_id:a.id});
              bytes += a.size_in_bytes || 0;
              core.info(`Artifact deleted: ${a.id}, ${a.size_in_bytes} bytes`);
            }
            core.info(`Old artifact bytes removed: ${bytes}`);
